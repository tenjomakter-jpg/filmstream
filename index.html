<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- SEO Meta Tags -->
    <title>FilmStream - Watch & Download Free Bangla, Hindi Movies and Web Series</title>
    <meta name="description" content="Download and watch the latest Bangla movies, Hindi dubbed movies, Hollywood movies, and web series online for free in HD quality.">
    <meta name="keywords" content="bangla movies, free movies download, watch web series, filmstream, latest hindi movies, dual audio movies">
    <meta name="author" content="FilmStream">
    <meta name="robots" content="index, follow">

    <!-- Open Graph / Social Media Meta Tags (Facebook, Telegram etc.) -->
    <meta property="og:title" content="FilmStream - Watch & Download Free Movies">
    <meta property="og:description" content="Explore and download the latest movies and web series in HD for free.">
    <meta property="og:type" content="website">
    <meta property="og:image" content="https://images.unsplash.com/photo-1536440136628-849c177e76a1?w=500">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0f172a;
            color: #fff;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        header {
            background-color: #1e293b;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .logo {
            font-size: 24px;
            font-weight: bold;
            color: #38bdf8;
            text-decoration: none;
        }
        .search-box input {
            padding: 8px 12px;
            border-radius: 4px;
            border: none;
            outline: none;
            width: 200px;
        }
        nav {
            background-color: #334155;
            padding: 10px 20px;
            display: flex;
            gap: 15px;
            overflow-x: auto;
        }
        nav button {
            background: none;
            border: none;
            color: #cbd5e1;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
        }
        nav button:hover, nav button.active {
            color: #38bdf8;
        }
        .ad-space {
            background-color: #1e293b;
            border: 1px dashed #475569;
            margin: 15px 20px 0 20px;
            padding: 15px;
            text-align: center;
            color: #94a3b8;
            font-size: 14px;
            border-radius: 6px;
        }
        main {
            padding: 20px;
            flex: 1;
        }
        .movie-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 20px;
        }
        .movie-card {
            background-color: #1e293b;
            border-radius: 8px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: transform 0.2s;
        }
        .movie-card:hover {
            transform: translateY(-5px);
        }
        .movie-poster {
            width: 100%;
            height: 230px;
            object-fit: cover;
        }
        .movie-info {
            padding: 12px;
            display: flex;
            flex-direction: column;
            flex: 1;
        }
        .movie-title {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 8px;
            line-height: 1.3;
        }
        .movie-tag {
            font-size: 11px;
            background-color: #0284c7;
            padding: 2px 6px;
            border-radius: 4px;
            width: fit-content;
            margin-bottom: 10px;
        }
        .download-btn {
            margin-top: auto;
            background-color: #22c55e;
            color: #fff;
            text-align: center;
            padding: 8px;
            text-decoration: none;
            border-radius: 4px;
            font-size: 13px;
            font-weight: bold;
        }
        .download-btn:hover {
            background-color: #16a34a;
        }
        footer {
            background-color: #1e293b;
            text-align: center;
            padding: 15px;
            font-size: 13px;
            color: #94a3b8;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <header>
        <a href="#" class="logo">FilmStream</a>
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Search Movies..." onkeyup="filterMovies()">
        </div>
    </header>

    <nav>
        <button class="active" onclick="filterCategory('all')">All</button>
        <button onclick="filterCategory('bangla')">Bangla</button>
        <button onclick="filterCategory('hindi')">Hindi</button>
        <button onclick="filterCategory('dubbed')">Bangla Dubbed</button>
        <button onclick="filterCategory('series')">Web Series</button>
    </nav>

    <!-- Ad Network Space -->
    <div class="ad-space">
        <span>Advertisement Banner Space</span>
    </div>

    <main>
        <div class="movie-grid" id="movieGrid">
            
            <!-- মুভি ১ -->
            <div class="movie-card" data-category="bangla" data-title="Shesh Thikana">
                <img src="https://images.unsplash.com/photo-1536440136628-849c177e76a1?w=300" alt="Shesh Thikana Movie Poster" class="movie-poster">
                <div class="movie-info">
                    <span class="movie-tag">Bangla</span>
                    <h2 class="movie-title" style="font-size: 14px; font-weight: 600;">Shesh Thikana (2026)</h2>
                    <a href="DOWNLOAD_LINK_HERE" class="download-btn" target="_blank">Download / Watch</a>
                </div>
            </div>

            <!-- মুভি ২ -->
            <div class="movie-card" data-category="hindi" data-title="Mirzapur The Movie">
                <img src="https://images.unsplash.com/photo-1485846234645-a62644f84728?w=300" alt="Mirzapur The Movie Poster" class="movie-poster">
                <div class="movie-info">
                    <span class="movie-tag">Hindi</span>
                    <h2 class="movie-title" style="font-size: 14px; font-weight: 600;">Mirzapur The Movie (2026)</h2>
                    <a href="DOWNLOAD_LINK_HERE" class="download-btn" target="_blank">Download / Watch</a>
                </div>
            </div>

        </div>
    </main>

    <footer>
        <p>&copy; 2026 FilmStream. All rights reserved.</p>
    </footer>

    <script>
        function filterCategory(cat) {
            const cards = document.querySelectorAll('.movie-card');
            const buttons = document.querySelectorAll('nav button');
            
            buttons.forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');

            cards.forEach(card => {
                if (cat === 'all' || card.getAttribute('data-category') === cat) {
                    card.style.display = 'flex';
                } else {
                    card.style.display = 'none';
                }
            });
        }

        function filterMovies() {
            const input = document.getElementById('searchInput').value.toLowerCase();
            const cards = document.querySelectorAll('.movie-card');

            cards.forEach(card => {
                const title = card.getAttribute('data-title').toLowerCase();
                if (title.includes(input)) {
                    card.style.display = 'flex';
                } else {
                    card.style.display = 'none';
                }
            });
        }
    </script>
</body>
</html>
